<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="1200" height="420" rx="20" fill="#0d1117"/>
  <text x="60" y="140" fill="#e6edf3" font-size="42" font-weight="700" letter-spacing="-1">dsh-restart-anywhere</text>
  <text x="62" y="188" fill="#8b949e" font-size="19">One restart button for the DeepSeek Harness</text>
  <text x="62" y="218" fill="#8b949e" font-size="19">web GUI that works with <tspan fill="#3fb950" font-weight="700">your</tspan> setup.</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600">
    <rect x="62" y="254" width="154" height="30" rx="15" fill="#161b22" stroke="#30363d"/><text x="139" y="274" fill="#3fb950" text-anchor="middle">0 dependencies</text>
    <rect x="226" y="254" width="109" height="30" rx="15" fill="#161b22" stroke="#30363d"/><text x="280.5" y="274" fill="#3fb950" text-anchor="middle">no config</text>
    <rect x="345" y="254" width="118" height="30" rx="15" fill="#161b22" stroke="#30363d"/><text x="404" y="274" fill="#3fb950" text-anchor="middle">same PID</text>
  </g>
  <g transform="translate(580 40)">
    <rect width="300" height="340" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="20" y="34" fill="#e6edf3" font-size="15" font-weight="700">DSH</text>
    <rect x="14" y="52" width="272" height="34" rx="8" fill="#21262d" stroke="#30363d"/><text x="150" y="74" fill="#e6edf3" font-size="14" text-anchor="middle">⊕  New Session</text>
    <text x="22" y="118" fill="#8b949e" font-size="13">Workspaces</text>
    <text x="22" y="148" fill="#c9d1d9" font-size="14">▸ my-project</text>
    <rect x="14" y="160" width="272" height="30" rx="8" fill="#21262d"/><text x="40" y="180" fill="#c9d1d9" font-size="14">Fix the flaky test</text>
    <rect x="14" y="252" width="272" height="34" rx="8" fill="#1f6feb" fill-opacity=".18" stroke="#58a6ff" stroke-opacity=".7"/>
    <g transform="translate(26 261)" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a7 7 0 1 1-2.05-4.95"/><path d="M16 1.5v4.5h-4.5"/></g>
    <text x="52" y="274" fill="#58a6ff" font-size="14" font-weight="600">Restart dsh</text>
    <text x="26" y="318" fill="#8b949e" font-size="14">⚙  Settings</text>
  </g>
  <g transform="translate(910 64)" font-size="15" fill="#c9d1d9">
    <text y="0"><tspan fill="#3fb950">✓</tspan>  systemd</text>
    <text y="34"><tspan fill="#3fb950">✓</tspan>  Docker / Podman</text>
    <text y="68"><tspan fill="#3fb950">✓</tspan>  Kubernetes</text>
    <text y="102"><tspan fill="#3fb950">✓</tspan>  pm2 · supervisord</text>
    <text y="136"><tspan fill="#3fb950">✓</tspan>  launchd · runit · s6</text>
    <text y="170"><tspan fill="#3fb950">✓</tspan>  terminal · tmux · nohup</text>
    <text y="204"><tspan fill="#3fb950">✓</tspan>  Windows</text>
    <text y="248" fill="#8b949e" font-size="13">no supervisor detection,</text>
    <text y="268" fill="#8b949e" font-size="13">no config, no root</text>
  </g>
</svg>
