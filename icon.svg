<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset=".45" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <radialGradient id="hi" cx=".25" cy=".15" r=".7">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".3"/>
    </linearGradient>
    <!-- loop fades in from its tail, so it reads as motion -->
    <linearGradient id="tail" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".25"/>
      <stop offset=".5" stop-color="#fff"/>
    </linearGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#fff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#1E1B4B" flood-opacity=".5"/></filter>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect width="64" height="64" rx="15" fill="url(#hi)"/>
  <rect width="64" height="64" rx="15" fill="url(#shade)"/>
  <g filter="url(#drop)">
    <path d="M45 24.5A15 15 0 1 1 32 17" fill="none" stroke="url(#tail)" stroke-width="4.2" stroke-linecap="round"/>
    <path d="M30 10.5l9 6.5-9 6.5z" fill="#fff" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="32" cy="32" r="9" fill="url(#core)"/>
    <circle cx="32" cy="32" r="4.5" fill="#fff"/>
  </g>
  <rect x=".5" y=".5" width="63" height="63" rx="14.5" fill="none" stroke="#fff" stroke-opacity=".18"/>
</svg>
